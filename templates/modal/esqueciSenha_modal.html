<div
    id="modalEsqueciSenha"
    class="modal-esqueci-senha">

    <div class="modal-esqueci-senha-conteudo">

        <!-- FECHAR -->

        <button
            type="button"
            id="fecharModalEsqueciSenha"
            class="fechar-modal-esqueci-senha">
            ×
        </button>


        <!-- TÍTULO -->

        <h2>
            Esqueci minha senha
        </h2>

        <p>
            Digite o e-mail cadastrado na sua conta.
        </p>


        <!-- EMAIL -->

        <div class="campo-esqueci-senha">

            <label for="emailEsqueciSenha">
                E-mail
            </label>

            <input
                type="email"
                id="emailEsqueciSenha"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

        </div>


        <!-- ERRO -->

        <div
            id="erroEsqueciSenha"
            class="erro-esqueci-senha">
        </div>


        <!-- BOTÃO -->

        <button
            type="button"
            id="btnEnviarCodigo"
            class="btn-enviar-codigo">

            Enviar código

        </button>

    </div>

</div>
