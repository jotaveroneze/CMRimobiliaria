<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Imobiliária</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

</head>

<body>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="login-card">

            <h1 class="text-center mb-3">
                Login
            </h1>

            <p class="text-center text-muted">
                Entre na sua conta
            </p>


            {% if erro %}

                <div
                    class="alert alert-danger text-center"
                    role="alert"
                >
                    {{ erro }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login.login') }}"
            >

                <!-- Nome ou e-mail -->

                <div class="mb-3">

                    <label
                        for="login"
                        class="form-label"
                    >
                        Nome ou e-mail
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="login"
                        name="login"
                        placeholder="Digite seu nome ou e-mail"
                        required
                    >

                </div>


                <!-- Senha -->

                <div class="mb-3">

                    <label
                        for="senha"
                        class="form-label"
                    >
                        Senha
                    </label>

                    <div class="input-group">

                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="mostrarSenha"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <!-- Botão -->

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Entrar
                </button>

            </form>


            <!-- Cadastro -->

            <div class="text-center mt-3">

                <a href="#" id="btnEsqueciSenha">
                    Esqueci minha senha
                </a>

            </div>


            <div class="text-center mt-3">

                <a href="{{ url_for('cadastro.cadastro') }}">
                    Criar uma conta
                </a>

            </div>

        </div>

    </main>


    <!-- JavaScript do login -->

    {% include 'modal/esqueciSenha_modal.html' %}

    <script
        src="{{ url_for('static', filename='js/login.js') }}"
    ></script>

</body>

</html>
