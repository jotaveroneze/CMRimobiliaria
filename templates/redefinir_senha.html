<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Redefinir senha - Imobiliária
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

</head>


<body>

    <main
        class="container d-flex justify-content-center align-items-center min-vh-100"
    >

        <div
            class="card shadow-sm p-4"
            style="width: 100%; max-width: 400px;"
        >

            <!-- TÍTULO -->

            <h1 class="text-center mb-3">

                Redefinir senha

            </h1>


            <!-- DESCRIÇÃO -->

            <p class="text-center text-muted">

                Seu e-mail foi verificado.
                Agora crie uma nova senha para sua conta.

            </p>


            <!-- ERRO -->

            {% if erro %}

                <div
                    class="alert alert-danger text-center"
                    role="alert"
                >

                    {{ erro }}

                </div>

            {% endif %}


            <!-- FORMULÁRIO -->

            <form
                method="POST"
                action="{{ url_for('esqueci_senha.redefinir_senha') }}"
            >


                <!-- NOVA SENHA -->

                <div class="mb-3">

                    <label
                        for="senha"
                        class="form-label"
                    >

                        Nova senha

                    </label>


                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua nova senha"
                        minlength="8"
                        required
                    >

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="mb-3">

                    <label
                        for="confirmar_senha"
                        class="form-label"
                    >

                        Confirmar nova senha

                    </label>


                    <input
                        type="password"
                        class="form-control"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite sua nova senha novamente"
                        minlength="8"
                        required
                    >

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >

                    Redefinir senha

                </button>


            </form>

        </div>

    </main>

</body>

</html>
